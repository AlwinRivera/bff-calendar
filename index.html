<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bff calendar ♡</title>
<meta name="description" content="See when your besties are free — across time zones.">
<meta name="theme-color" content="#FFF6F1">
<meta name="app-version" content="2026-11-14b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💞</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6F1; --card:#FFFFFF; --ink:#4A3B4F; --muted:#9C8CA3; --line:#F3E4EC;
  --pink:#FF8FAB; --pinkS:#FFE4EC; --mint:#6FD3BA; --mintS:#DDF6EF;
  --lav:#B9A4EC; --lavS:#EEE8FB; --butter:#FFE7A8; --butterS:#FFF6DC;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:600}
body{background:
  radial-gradient(circle at 10% 0%,#FFE1EA 0,transparent 40%),
  radial-gradient(circle at 100% 20%,#E6F7F1 0,transparent 35%),var(--bg);min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:18px 16px 190px}
header{text-align:center;padding:6px 0 10px}
.logo{font-family:Fredoka,sans-serif;font-size:30px;font-weight:700;letter-spacing:-.5px;color:var(--ink)}
.logo .h{color:var(--pink);display:inline-block;animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}10%{transform:scale(1.25)}20%{transform:scale(1)}}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
h2{font-family:Fredoka,sans-serif;font-size:19px;font-weight:600;margin:22px 4px 10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 6px 20px rgba(220,150,180,.13),0 1px 0 var(--line);border:1.5px solid #FFF}
.note{background:var(--butterS);border:1.5px dashed #F4D27A;border-radius:16px;padding:10px 14px;font-size:14px;margin:8px 0}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:15px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row-between h2{margin-right:auto}

.join{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:16px 18px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;text-align:left;background:linear-gradient(135deg,#FFE4EC,#FFF1DA)}
.join b{font-family:Fredoka;font-size:18px}
.join span{color:var(--muted);font-size:13px}

.now-list{display:flex;flex-direction:column;gap:10px}
.now{display:flex;align-items:center;gap:12px;padding:12px 14px}
.av{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:24px;border:2.5px solid}
.av.sm{width:30px;height:30px;font-size:16px;border-width:2px}
.nw{flex:1;min-width:0}
.nn{display:flex;align-items:center;gap:6px;font-size:16px}
.nn b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.you{font-size:10px;background:var(--lavS);color:#7A62C4;padding:2px 7px;border-radius:99px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.nt{font-size:13px;color:var(--muted)}
.ns{font-size:13px;color:#7B6A80;font-style:italic;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;font-size:12px;font-weight:800;padding:6px 10px;border-radius:99px;white-space:nowrap}
.pill.busy{background:var(--pinkS);color:#D9547A}
.pill.free{background:var(--mintS);color:#2E9C80}
.pill.sleep{background:var(--lavS);color:#7A62C4}
.pill.open{background:var(--butterS);color:#B98A12}

select,input[type=text],input[type=date],input[type=time]{font:inherit;color:var(--ink);background:#FFF;border:2px solid var(--line);border-radius:14px;padding:9px 12px;outline:none;width:100%}
select:focus,input:focus{border-color:var(--pink)}
.tzsel{width:auto;max-width:190px;font-size:13px;padding:7px 10px;border-radius:99px;background:#FFF}

.days{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:54px;padding:8px 0;border-radius:18px;border:2px solid var(--line);background:#FFF;text-align:center;cursor:pointer;font:inherit;color:inherit}
.day small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.day b{font-family:Fredoka;font-size:19px}
.day.on{background:var(--pink);border-color:var(--pink);color:#FFF}
.day.on small{color:#FFE8EF}

.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin:4px 4px 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}

.tl{padding:14px 14px 6px}
.axis{position:relative;height:18px;margin-bottom:4px}
.axis span{position:absolute;transform:translateX(-50%);font-size:10.5px;color:var(--muted);font-weight:700}
.tl-row{margin-bottom:12px}
.tl-name{display:flex;align-items:center;gap:7px;font-size:13.5px;margin-bottom:5px}
.tl-name b{font-weight:800}
.tl-name small{color:var(--muted);font-weight:700}
.bar{position:relative;height:26px;border-radius:10px;background:var(--butterS);overflow:hidden}
.grid{position:absolute;top:0;bottom:0;width:1px;background:rgba(160,130,150,.13)}
.seg{position:absolute;top:0;bottom:0;cursor:pointer}
.s-busy{background:var(--pink)}
.s-free{background:var(--mint)}
.s-sleep{background:repeating-linear-gradient(135deg,#E6DDFA 0 6px,#F2EDFC 6px 12px)}
.nowline{position:absolute;top:-3px;bottom:-3px;width:2.5px;background:var(--ink);border-radius:2px;z-index:2}
.nowline:after{content:"";position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:99px;border:2px solid var(--line);background:#FFF;font:inherit;font-size:14px;color:inherit;cursor:pointer}
.chip.off{opacity:.45;filter:grayscale(.6)}
.seg-ctl{display:flex;background:#FFF;border:2px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.seg-ctl button{flex:1;border:0;background:none;font:inherit;font-size:14px;padding:7px 0;border-radius:99px;color:var(--muted);cursor:pointer}
.seg-ctl button.on{background:var(--ink);color:#FFF}
.ovl{padding:14px}
.ovl p{margin:8px 0 0;font-size:14px}
.slot{padding:14px 16px;margin-bottom:10px}
.slot .when{font-family:Fredoka;font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slot .when small{font-family:Nunito;font-size:13px;color:var(--muted)}
.slot .who{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:10px 0 12px;font-size:14px}
.slot .who span:nth-child(even){color:var(--muted);text-align:right;font-weight:700}
.btn{border:0;font:inherit;font-weight:800;font-size:15px;padding:12px 18px;border-radius:99px;background:var(--pink);color:#FFF;cursor:pointer;box-shadow:0 4px 0 #E8708F}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #E8708F}
.btn.soft{background:var(--pinkS);color:#D9547A;box-shadow:none;font-size:14px;padding:9px 14px}
.btn.mint{background:var(--mint);box-shadow:0 4px 0 #4DB59B}
.btn.full{width:100%}
.btn[disabled]{opacity:.5}

.form{padding:18px}
.form label.l{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:800}
.form label.l:first-child{margin-top:0}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emojis button{font-size:24px;aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:#FFF;cursor:pointer}
.emojis button.on{border-color:var(--pink);background:var(--pinkS);transform:scale(1.06)}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid #FFF;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.colors button.on{box-shadow:0 0 0 3px var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kind button{padding:12px 6px;border-radius:16px;border:2px solid var(--line);background:#FFF;font:inherit;font-size:15px;cursor:pointer;color:inherit}
.kind button.on.b{border-color:var(--pink);background:var(--pinkS)}
.kind button.on.f{border-color:var(--mint);background:var(--mintS)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:12px}
.check input{width:18px;height:18px;accent-color:var(--pink)}
.mine{padding:6px 14px}
.mi{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1.5px dashed var(--line);font-size:14px}
.mi:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.mi .t{flex:1}
.mi .t small{display:block;color:var(--muted)}
.x{border:0;background:var(--lavS);color:#7A62C4;width:28px;height:28px;border-radius:50%;font-weight:800;cursor:pointer}
details{margin-top:10px;font-size:14px}
details summary{cursor:pointer;color:#D9547A;font-weight:800}
details ol{padding-left:20px;margin:8px 0;color:#6B5B70}
details li{margin-bottom:4px}
.file{display:block;margin-top:12px}
.file input{display:none}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}

nav.tabs{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;background:#FFF;padding:6px;border-radius:99px;box-shadow:0 10px 30px rgba(180,110,140,.25);z-index:5}
nav.tabs button{border:0;background:none;font:inherit;font-size:14px;font-weight:800;color:var(--muted);padding:10px 16px;border-radius:99px;cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:var(--ink);color:#FFF}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#FFF;padding:11px 16px;border-radius:16px;font-size:14px;max-width:min(92vw,460px);opacity:0;pointer-events:none;transition:.25s;z-index:9;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.copybox{width:100%;min-height:90px;margin-top:8px;border-radius:12px;border:2px solid var(--line);padding:8px;font:inherit;font-size:13px}

.cbar{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 6px;flex-wrap:wrap}
.cname{font-family:Fredoka;font-weight:600;font-size:15px;background:#FFF;padding:7px 14px;border-radius:99px;border:2px solid var(--line)}
.welcome{text-align:center;padding:26px 20px}
.welcome .big{font-size:56px;line-height:1}
.welcome h3{font-family:Fredoka;font-size:22px;margin:10px 0 6px}
.welcome p{color:#7B6A80;font-size:15px;margin:0 0 18px}
.welcome form{text-align:left}
a{color:#D9547A;font-weight:800}
.mi input{flex:1}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">bff calendar <span class="h">♡</span></div>
    <div class="sub">who's free · who's sleeping · when to call</div>
  </header>
  <div id="circlebar"></div>
  <main id="view"></main>
  <div id="copywrap"></div>
  <footer>made with ♡</footer>
</div>
<nav class="tabs" style="display:none">
  <button data-act="tab" data-tab="friends">🏠 Friends</button>
  <button data-act="tab" data-tab="find">💞 Find a time</button>
  <button data-act="tab" data-tab="me">🐰 Me</button>
</nav>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
